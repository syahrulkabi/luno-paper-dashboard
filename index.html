<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Luno Paper Bot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="p-3 sm:p-6 max-w-4xl mx-auto">

  <!-- Header -->
  <header class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
    <div>
      <h1 class="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
        <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        Luno Paper Trading
      </h1>
      <p class="text-xs text-gray-400">Target: RM 100 ➔ RM 1,000</p>
    </div>
    <button onclick="resetPortfolio()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs px-3 py-2 rounded-lg font-medium border border-red-500/20 transition">
      Reset Bot
    </button>
  </header>

  <!-- Metric Cards Grid -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
      <span class="text-xs text-gray-400 block mb-1">Total Portfolio</span>
      <span id="total-val" class="text-lg sm:text-xl font-bold text-white">RM --.--</span>
    </div>
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
      <span class="text-xs text-gray-400 block mb-1">P&L (%)</span>
      <span id="pnl-val" class="text-lg sm:text-xl font-bold text-gray-400">0.00%</span>
    </div>
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
      <span class="text-xs text-gray-400 block mb-1">BTC Price (Luno)</span>
      <span id="btc-price" class="text-lg sm:text-xl font-bold text-amber-400">RM --</span>
    </div>
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
      <span class="text-xs text-gray-400 block mb-1">Cash Balance</span>
      <span id="cash-bal" class="text-lg sm:text-xl font-bold text-emerald-400">RM --.--</span>
    </div>
  </div>

  <!-- Main Chart Section -->
  <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl mb-6">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-sm font-semibold text-gray-300">Live BTC/MYR Price Tracking</h2>
      <span id="last-updated" class="text-xs text-gray-500">Updating...</span>
    </div>
    <div class="h-48 sm:h-64">
      <canvas id="priceChart"></canvas>
    </div>
  </div>

  <!-- Action Bar for Mobile Testing -->
  <div class="flex gap-2 mb-6">
    <button onclick="triggerBot()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-semibold text-sm transition shadow-lg shadow-emerald-900/20 active:scale-[0.98]">
      ⚡ Run Trade Check Now
    </button>
  </div>

  <!-- Trade History Log -->
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
    <h2 class="text-sm font-semibold text-gray-300 mb-3">Simulated Executions Log</h2>
    <div id="trades-container" class="space-y-2 max-h-60 overflow-y-auto pr-1">
      <div class="text-xs text-gray-500 text-center py-4">No trades executed yet.</div>
    </div>
  </div>

  <script>
    // Replace with your Cloudflare Worker URL
    const WORKER_URL = 'luno-paper-bot.syahrulkabi.workers.dev';

    let chart;

    function initChart() {
      const ctx = document.getElementById('priceChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: 'BTC Price (MYR)',
            data: [],
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245, 158, 11, 0.1)',
            fill: true,
            tension: 0.3,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { display: false },
            y: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af', font: { size: 10 } } }
          }
        }
      });
    }

    async function loadData() {
      try {
        const res = await fetch(`${WORKER_URL}/api/data`);
        const data = await res.json();

        document.getElementById('total-val').innerText = `RM ${data.total_portfolio_myr.toFixed(2)}`;
        
        const pnlEl = document.getElementById('pnl-val');
        pnlEl.innerText = `${data.pnl_percent > 0 ? '+' : ''}${data.pnl_percent.toFixed(2)}%`;
        pnlEl.className = `text-lg sm:text-xl font-bold ${data.pnl_percent >= 0 ? 'text-emerald-400' : 'text-red-400'}`;

        document.getElementById('btc-price').innerText = `RM ${data.current_price.toLocaleString()}`;
        document.getElementById('cash-bal').innerText = `RM ${data.balance_myr.toFixed(2)}`;
        document.getElementById('last-updated').innerText = `Updated: ${new Date(data.last_updated).toLocaleTimeString()}`;

        // Chart Update
        if (data.price_history && data.price_history.length > 0) {
          chart.data.labels = data.price_history.map(p => new Date(p.timestamp).toLocaleTimeString());
          chart.data.datasets[0].data = data.price_history.map(p => p.price);
          chart.update();
        }

        // Trade Logs
        const tradesContainer = document.getElementById('trades-container');
        if (data.trades && data.trades.length > 0) {
          tradesContainer.innerHTML = data.trades.map(t => `
            <div class="flex justify-between items-center bg-gray-950 p-2.5 rounded-lg border border-gray-800 text-xs">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded font-bold ${t.type === 'BUY' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">
                  ${t.type}
                </span>
                <span class="text-gray-300">@ RM ${t.price.toLocaleString()}</span>
              </div>
              <div class="text-right">
                <div class="text-gray-200 font-mono">RM ${t.amount_myr.toFixed(2)}</div>
                <div class="text-gray-500 text-[10px]">${new Date(t.timestamp).toLocaleTimeString()}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Failed to connect to Worker API:', err);
      }
    }

    async function triggerBot() {
      await fetch(`${WORKER_URL}/api/trigger`, { method: 'POST' });
      loadData();
    }

    async function resetPortfolio() {
      if (confirm('Reset paper account back to RM 100.00?')) {
        await fetch(`${WORKER_URL}/api/reset`, { method: 'POST' });
        loadData();
      }
    }

    initChart();
    loadData();
    setInterval(loadData, 30000); // Auto refresh UI every 30 seconds
  </script>
</body>
</html>
